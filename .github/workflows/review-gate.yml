# review-gate: PRs that touch Go code must carry an "Adversarial
# review" section in their body — the record that the skeptic pass
# from AGENTS.md "How we develop" actually ran (findings fixed/pinned;
# for bug fixes, the regression test verified to FAIL on pre-fix
# code). Docs-only PRs are exempt. This is the tool-agnostic backstop
# behind the opt-in dev/claude/settings-review-gate.json PreToolUse
# hook: it catches PRs from any client, and edits that strip the
# section re-fail on the `edited` trigger. Ported from core-agent.
name: review-gate

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  review-gate:
    # Explicit bot allowlist (never `user.type == 'Bot'`, so third-party bots
    # do not silently inherit the exemption). A skipped job satisfies branch
    # protection so authorized automation PRs merge normally.
    if: >-
      !contains(fromJSON('["github-actions[bot]", "go-steer-bot[bot]"]'),
      github.event.pull_request.user.login)
    runs-on: ubuntu-latest
    steps:
      - name: Require adversarial-review section on Go-touching PRs
        env:
          # Body and title via env, never interpolated into the script —
          # PR metadata is attacker-controlled on public repos.
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          if ! grep -qE '\.go$' <<<"$files"; then
            echo "No Go changes — review gate not required."
            exit 0
          fi

          # Extract the "## Adversarial review" section (fence-aware, stops
          # at the next heading of level <= 2).
          section=$(awk '
            /^[[:space:]]*```/ { fence = !fence }
            !fence && tolower($0) ~ /^##[[:space:]]+adversarial[[:space:]]+review([[:space:]:—-].*)?$/ {
              in_sec = 1
              next
            }
            !fence && tolower($0) ~ /^adversarial[[:space:]]+review:[[:space:]]*/ {
              in_sec = 1
              line = $0
              sub(/^[Aa][Dd][Vv][Ee][Rr][Ss][Aa][Rr][Ii][Aa][Ll][[:space:]]+[Rr][Ee][Vv][Ii][Ee][Ww]:[[:space:]]*/, "", line)
              print line
              next
            }
            in_sec && !fence && /^##?[[:space:]]+/ { exit }
            in_sec { print }
          ' <<<"${PR_BODY:-}")

          non_ws=$(printf '%s' "$section" | tr -d '[:space:]' | wc -c | tr -d '[:space:]')
          if [[ "$non_ws" -lt 80 ]]; then
            echo '::error::This PR touches Go code but its body lacks a substantive "## Adversarial review" section (need a "## Adversarial review" heading followed by at least 80 non-whitespace characters recording the skeptic pass and findings/dispositions per AGENTS.md "How we develop").'
            exit 1
          fi

          # For fix: / fix(...) PRs, require explicit mention of pre-fix
          # regression-test verification (or the documented exemption phrase).
          fix_re='^fix(\([^)]+\))?!?:'
          if [[ "${PR_TITLE:-}" =~ $fix_re ]]; then
            if ! grep -qiE 'pre-fix|prefix-failure|before[[:space:]]+the[[:space:]]+fix|unfixed|passes[[:space:]]+before[[:space:]]+and[[:space:]]+after,[[:space:]]+by[[:space:]]+design' <<<"${PR_BODY:-}"; then
              echo '::error::This is a fix: PR touching Go code, but the PR body does not record pre-fix regression test failure verification. Patch the bug back, verify the new test fails before the fix, and record the pre-fix failure in the PR body.'
              exit 1
            fi
          fi

          echo "Adversarial-review section present (${non_ws} non-whitespace chars)."
